name: Pokemon Asteria GBA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download game source
        uses: actions/checkout@v4

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            git \
            libpng-dev \
            python3

      - name: Compile Emerald Expansion
        run: make -j2

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Asteria-Test-Build
          path: "*.gba"
          if-no-files-found: error
